# ===== WITHDRAW =====
withdraw_requests={}
@bot.message_handler(func=lambda m:m.text=="💸 ដកប្រាក់")
@require_join
def wd_start(m):
    if get_balance(m.from_user.id)<0.25:
        bot.send_message(m.chat.id,"Min withdraw $0.25")
        return
    bot.send_message(m.chat.id,"📸 Send QR code")

@bot.message_handler(content_types=['photo'])
def get_qr(m):
    withdraw_requests[m.from_user.id]={"qr":m.photo[-1].file_id}
    bot.send_message(m.chat.id,"💰 Amount?")

@bot.message_handler(func=lambda m:m.text.replace('.','',1).isdigit())
def get_amount(m):
    uid=m.from_user.id
    if uid not in withdraw_requests: return
    amount=float(m.text)
    if amount>get_balance(uid):
        bot.send_message(m.chat.id,"❌ Not enough")
        return
    withdraw_requests[uid]["amount"]=amount
    mk=types.InlineKeyboardMarkup()
    mk.add(types.InlineKeyboardButton("✅",callback_data=f"wd_done_{uid}"))
    mk.add(types.InlineKeyboardButton("❌",callback_data=f"wd_no_{uid}"))
    bot.send_photo(ADMIN_GROUP_ID,withdraw_requests[uid]["qr"],caption=f"User:{uid} ${amount}",reply_markup=mk)
    bot.send_message(m.chat.id,"Sent to admin")

@bot.callback_query_handler(func=lambda c:c.data.startswith("wd_"))
def wd_cb(ca):
    _,act,uid=ca.data.split("_")
    uid=int(uid)
    if uid not in withdraw_requests: return
    amt=withdraw_requests[uid]["amount"]
    if act=="done":
        sub_money(uid,amt)
        bot.send_message(uid,f"✅ Paid ${amt}")
    else:
        bot.send_message(uid,"❌ Cancel")
    del withdraw_requests[uid]
    bot.answer_callback_query(ca.id)

