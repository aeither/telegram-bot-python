# ===== DAILY =====
@bot.message_handler(func=lambda m:m.text=="🎁 Daily Bonus")
@require_join
def daily(m):
    uid=m.from_user.id
    now=int(time.time())
    c.execute("SELECT last_claim FROM users WHERE user_id=?",(uid,))
    last=c.fetchone()[0]
    if now-last<86400:
        bot.send_message(m.chat.id,"⏳ wait 24h")
        return
    add_money(uid,0.02)
    c.execute("UPDATE users SET last_claim=? WHERE user_id=?",(now,uid))
    db.commit()
    bot.send_message(m.chat.id,"🎉 +0.02")

