async def jugar(update: Update, context: ContextTypes.DEFAULT_TYPE):
    """Comando /jugar [índice]"""
    if not context.args:
        await update.message.reply_text("Uso: /jugar [índice_carta]")
        return
    
    try:
        indice = int(context.args[0])
    except:
        await update.message.reply_text("❌ Índice inválido")
        return
    
    user_id = update.effective_user.id
    
    game_id = None
    for gid in games:
        if any(j["user_id"] == user_id for j in games[gid].jugadores):
            game_id = gid
            break
    
    if not game_id:
        await update.message.reply_text("❌ No estás en un juego")
        return
    
    juego = games[game_id]
    exito, mensaje = juego.jugar_carta(user_id, indice)
    
    if exito:
        jugador = next(j for j in juego.jugadores if j["user_id"] == user_id)
        await context.bot.send_message(
            chat_id=juego.chat_id,
            text=f"✅ {jugador['nombre']} jugó: {juego.descarte[-1]}"
        )
        
        # Verificar ganador
        ganador = juego.verificar_ganador()
        if ganador:
            await context.bot.send_message(
                chat_id=juego.chat_id,
                text=f"🏆 ¡{ganador['nombre']} ganó!"
            )
            del games[game_id]
        else:
            # Mostrar turno siguiente
            siguiente = juego.obtener_jugador_actual()
            await context.bot.send_message(
                chat_id=juego.chat_id,
                text=f"Turno de: {siguiente['nombre']}"
            )
            
            # Enviar mano privada
            mano_texto = "\n".join([f"{i}: {c}" for i, c in enumerate(siguiente["mano"])])
            await context.bot.send_message(
                chat_id=siguiente["user_id"],
                text=f"Tu turno!\nTu mano:\n{mano_texto}\nÚltima carta jugada: {juego.descarte[-1]}"
            )
    else:
        await update.message.reply_text(f"❌ {mensaje}")

async def robar(update: Update, context: ContextTypes.DEFAULT_TYPE):
    """Comando /robar"""
    user_id = update.effective_user.id
    
    game_id = None
    for gid in games:
        if any(j["user_id"] == user_id for j in games[gid].jugadores):
            game_id = gid
            break
    
    if not game_id:
        await update.message.reply_text("❌ No estás en un juego")
        return
    
    juego = games[game_id]
    exito, mensaje = juego.robar_carta(user_id)
    
    if exito:
        await context.bot.send_message(
            chat_id=juego.chat_id,
            text=f"🎴 {juego.jugadores[[j['user_id'] for j in juego.jugadores].index(user_id)]['nombre']} robó carta(s)"
        )
        
        # Mostrar turno siguiente
        siguiente = juego.obtener_jugador_actual()
        mano_texto = "\n".join([f"{i}: {c}" for i, c in enumerate(siguiente["mano"])])
        await context.bot.send_message(
            chat_id=siguiente["user_id"],
            text=f"Tu turno!\nTu mano:\n{mano_texto}"
        )
    else:
        await update.message.reply_text(f"❌ {mensaje}")

# Función principal
async def main():
    """Inicia el bot"""
    application = Application.builder().token(TOKEN).build()
    
    # Handlers
    application.add_handler(CommandHandler("start", start))
    application.add_handler(CommandHandler("crear_juego", crear_juego))
    application.add_handler(CommandHandler("unirse", unirse))
    application.add_handler(CommandHandler("empezar", empezar))
    application.add_handler(CommandHandler("estado", estado))
    application.add_handler(CommandHandler("jugar", jugar))
    application.add_handler(CommandHandler("robar", robar))
    
    # Iniciar bot
    await application.run_polling()

if __name__ == "__main__":
    import asyncio
    asyncio.run(main())
