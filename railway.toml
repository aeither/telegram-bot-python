# ===== DATABASE =====
db = sqlite3.connect("users.db", check_same_thread=False)
c = db.cursor()

c.execute("""
CREATE TABLE IF NOT EXISTS users(
    user_id INTEGER PRIMARY KEY,
    balance REAL DEFAULT 0,
    referrer INTEGER,
    joined INTEGER DEFAULT 0,
    banned INTEGER DEFAULT 0,
    last_claim INTEGER DEFAULT 0
)
""")
db.commit()

# ===== DB FUNCTIONS =====
def add_user(uid, ref=None):
    c.execute("INSERT OR IGNORE INTO users(user_id,balance,referrer,joined,banned,last_claim) VALUES(?,?,?,?,?,?)",
              (uid,0,ref,0,0,0))
    db.commit()

def get_balance(uid):
    c.execute("SELECT balance FROM users WHERE user_id=?", (uid,))
    r = c.fetchone()
    return r[0] if r else 0

def add_money(uid, amt):
    c.execute("UPDATE users SET balance=balance+? WHERE user_id=?", (amt,uid))
    db.commit()

def sub_money(uid, amt):
    c.execute("UPDATE users SET balance=balance-? WHERE user_id=?", (amt,uid))
    db.commit()

def is_joined(uid):
    c.execute("SELECT joined FROM users WHERE user_id=?", (uid,))
    r = c.fetchone()
    return r[0] if r else 0

def set_joined(uid):
    c.execute("UPDATE users SET joined=1 WHERE user_id=?", (uid,))
    db.commit()

def is_banned(uid):
    c.execute("SELECT banned FROM users WHERE user_id=?", (uid,))
    r = c.fetchone()
    return r[0] if r else 0

def is_admin(uid):
    return uid == ADMIN_ID

# ===== CHECK JOIN =====
def check_join(uid):
    try:
        member = bot.get_chat_member(CHANNEL, uid)
        return member.status in ["member","administrator","creator"]
    except:
        return False

# ===== REQUIRE JOIN DECORATOR =====
def require_join(func):
    def wrapper(m):
        uid = m.from_user.id
        if is_banned(uid):
            bot.send_message(m.chat.id,"🚫 អ្នកត្រូវបាន ban")
            return
        if not check_join(uid):
            mk = types.InlineKeyboardMarkup()
            mk.add(types.InlineKeyboardButton("📢 Join", url=f"https://t.me/{CHANNEL[1:]}"))
            mk.add(types.InlineKeyboardButton("✅ Check", callback_data="check"))
            bot.send_message(m.chat.id,"❌ Join channel មុន",reply_markup=mk)
            return
        return func(m)
    return wrapper

