    bot.send_message(cid,"📋 VIP MENU",reply_markup=mk)

# ===== START =====
@bot.message_handler(commands=['start'])
def start(m):
    uid = m.from_user.id
    args = m.text.split()
    ref = None
    if len(args) > 1:
        try:
            ref = int(args[1])
        except: ref=None
    if ref == uid: ref=None

    c.execute("SELECT user_id FROM users WHERE user_id=?", (uid,))
    if c.fetchone() is None: add_user(uid,ref)
    else: add_user(uid)

    if is_banned(uid):
        bot.send_message(m.chat.id,"🚫 banned")
        return

    if not check_join(uid):
        mk = types.InlineKeyboardMarkup()
        mk.add(types.InlineKeyboardButton("📢 Join", url=f"https://t.me/{CHANNEL[1:]}"))
        mk.add(types.InlineKeyboardButton("✅ Check", callback_data="check"))
        bot.send_message(m.chat.id,"📢 Join channel first",reply_markup=mk)
        return

    bot.send_message(m.chat.id,"✅ Welcome! /start works now")
    menu(m.chat.id, uid)

# ===== CALLBACK CHECK =====
@bot.callback_query_handler(func=lambda c:c.data=="check")
def check_cb(ca):
    uid = ca.from_user.id
    if not check_join(uid):
        bot.answer_callback_query(ca.id,"❌ Join first")
        return

    if is_joined(uid)==0:
        add_money(uid,0.03)
        set_joined(uid)
        c.execute("SELECT referrer FROM users WHERE user_id=?", (uid,))
        ref=c.fetchone()
        if ref and ref[0]:
            add_money(ref[0],0.04)
            try: bot.send_message(ref[0],"🎉 Referral +$0.04")
            except: pass

    bot.answer_callback_query(ca.id,"✅ Done")
    menu(ca.message.chat.id,uid)

